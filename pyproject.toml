[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reai"
version = "0.1.0"
description = "Autonomous first-pass malware reverse-engineering pipeline built around IDA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
reai = "reai.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
